<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">

    <title>Temperaturen</title>

    <style>
        body {
            font-family: sans-serif;
        }

        .controls {
            margin-bottom: 20px;
        }

        .graph-block {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 30px;
        }

        .controls button {
            padding: 6px 12px;
            margin-right: 4px;
            cursor: pointer;
        }

        .controls button.active {
            background: #555;
            color: white;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1 id="sitename">Temperaturen</h1>

<div class="controls">
    <button id="range-1h"
            onclick="setRange('1h')">1 Stunde</button>

    <button id="range-24h"
            onclick="setRange('24h')">24 Stunden</button>

    <button id="range-7d"
            onclick="setRange('7d')">7 Tage</button>

    <button id="range-30d"
            onclick="setRange('30d')">30 Tage</button>

    <button id="range-1y"
            onclick="setRange('1y')">1 Jahr</button>
</div>

<div id="graphs"></div>

<script src="/luci-plot.js"></script>
<script>

let currentRange;
let graphList = [];


/*
 * Konfiguration der Webseite laden.
 *
 * Das CGI liefert:
 *
 * {
 *     "sitename":"...",
 *     "graphs":[
 *         "...",
 *         "..."
 *     ]
 * }
 */
async function loadConfiguration()
{
    const response =
        await fetch(
            "/cgi-bin/tempread?list=1"
        );

    return await response.json();
}


/*
 * Messdaten eines Graphen laden.
 */
async function loadGraph(graph)
{
    const response =
        await fetch(
            "/cgi-bin/tempread?graph=" +
            encodeURIComponent(graph) +
            "&range=" +
            currentRange
        );

    return await response.json();
}


/*
 * Graph-Blöcke anhand der vom CGI gelieferten
 * Konfiguration erzeugen.
 */
function createGraphs(configuration)
{
    const container =
        document.getElementById("graphs");


    container.replaceChildren();


    graphList =
        configuration.graphs || [];


    for (let i = 0;
         i < graphList.length;
         i++) {

        const graphName =
            graphList[i];


        const block =
            document.createElement("div");

        block.className =
            "graph-block";


        const heading =
            document.createElement("h2");

        heading.textContent =
            graphName;


        const plot =
            document.createElement("div");

        plot.id =
            "graph-" + i;

        block.appendChild(
            heading
        );

        block.appendChild(
            plot
        );

        container.appendChild(
            block
        );

    }
}


/*
 * Einen Graphen zeichnen.
 */
function drawGraph(plotId, json)
{
    const target =
        document.getElementById(
            plotId
        );


    if (target == null) {
        return;
    }


    if (!json.meta ||
        !Array.isArray(json.data) ||
        !Array.isArray(json.meta.legend)) {

        target.textContent =
            "Keine Daten vorhanden";

        return;
    }


    const entries = [];

    const start =
        Number(json.meta.start);

    const step =
        Number(json.meta.step);


    for (let i = 0;
         i < json.data.length;
         i++) {

        const row =
            json.data[i];

        const entry = {
            timestamp:
                start + i * step
        };


        for (let column = 0;
             column < row.length;
             column++) {

            entry[
                "sensor" + column
            ] = row[column];
        }


        entries.push(
            entry
        );
    }


    const series = [];

    for (let i = 0;
         i < json.meta.legend.length;
         i++) {

        series.push({
            key:
                "sensor" + i,

            label:
                json.meta.legend[i],

            unit:
                "°C",

            digits:
                1
        });
    }


    LuciPlot.render(
        target,
        entries,
        {
            x: {
                key:
                    "timestamp",

                type:
                    "time"
            },

            axes: {
                default: {
                    unit:
                        "°C"
                }
            },

            series:
                series
        }
    );
}

/*
 * Alle konfigurierten Graphen aktualisieren.
 */
async function updateGraphs()
{
    for (let i = 0;
         i < graphList.length;
         i++) {

        const graphName =
            graphList[i];

        const json =
            await loadGraph(
                graphName
            );

        drawGraph(
            "graph-" + i,
            json
        );
    }
}


/*
 * Zeitraum auswählen.
 */
function setRange(range)
{
    currentRange =
        range;


    const buttons =
        document.querySelectorAll(
            ".controls button"
        );


    for (const button of buttons) {
        button.classList.remove(
            "active"
        );
    }


    const activeButton =
        document.getElementById(
            "range-" + range
        );


    if (activeButton != null) {
        activeButton.classList.add(
            "active"
        );
    }


    updateGraphs();
}


/*
 * Seite initialisieren.
 */
async function initialize()
{
    const configuration =
        await loadConfiguration();


    const sitename =
        configuration.sitename ||
        "Temperaturen";


    document.title =
        sitename;

    document.getElementById(
        "sitename"
    ).textContent =
        sitename;


    createGraphs(
        configuration
    );


    setRange(
        "1h"
    );
}


let resizeTimer;


window.addEventListener(
    "resize",
    function()
    {
        clearTimeout(
            resizeTimer
        );

        resizeTimer =
            setTimeout(
                function()
                {
                    updateGraphs();
                },
                150
            );
    }
);


initialize();

</script>

</body>
</html>
